<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>pinoy-quiz</title>
    <script>
      // Runs before React mounts / before first paint, so the correct
      // theme is on <html> immediately — no flash of the wrong theme.
      // Kept in sync with the fallback logic in src/hooks/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("pinoyquiz-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          if (theme === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {
          /* localStorage/matchMedia unavailable — default dark stands. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
